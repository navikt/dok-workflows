organisasjon: navikt
team: teamdokumenthandtering

# name under rules er lesbare navn fra GitHub; type og parameters er API-felter.
# Hele verdier på formen ${...} fylles inn av scriptet.
rulesets:
  - name: dok-baseline
    target: branch
    enforcement: active
    bypass_actors: []
    rules:
      - name: Restrict deletions
        type: deletion
      - name: Block force pushes
        type: non_fast_forward
      - name: Require a pull request before merging
        type: pull_request
        parameters:
          allowed_merge_methods: [merge, squash, rebase]
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: false
          required_reviewers: []
          dismissal_restriction:
            enabled: false
            allowed_actors: []

  - name: dok-quality
    target: branch
    enforcement: active
    bypass_actors:
      - &team_pr
        actor_id: '${team_id}'
        actor_type: Team
        bypass_mode: pull_request
    rules:
      - name: Require a pull request before merging
        type: pull_request
        parameters:
          allowed_merge_methods: [merge, squash, rebase]
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: false
          require_last_push_approval: false
          # Require conversation resolution before merging
          required_review_thread_resolution: false
          required_reviewers: []
          dismissal_restriction:
            enabled: false
            allowed_actors: []
      - name: Require status checks to pass before merging
        type: required_status_checks
        parameters:
          # Require branches to be up to date before merging
          strict_required_status_checks_policy: true
          do_not_enforce_on_create: false
          required_status_checks: '${required_checks}'

  - name: dok-review
    target: branch
    enforcement: active
    bypass_actors:
      - *team_pr
      - &automerge_pr
        actor_id: '${automerge_app_id}'
        actor_type: Integration
        bypass_mode: pull_request
    rules:
      - name: Require a pull request before merging
        type: pull_request
        parameters:
          allowed_merge_methods: [merge, squash, rebase]
          required_approving_review_count: 1
          # Dismiss stale pull request approvals when new commits are pushed
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: false
          required_reviewers:
            - file_patterns: ['**/*']
              minimum_approvals: 1
              reviewer:
                id: '${team_id}'
                type: Team
          dismissal_restriction:
            enabled: false
            allowed_actors: []

  - name: dok-merge
    target: branch
    enforcement: active
    bypass_actors:
      - *team_pr
      - *automerge_pr
    rules:
      - name: Restrict updates
        type: update
        parameters:
          update_allows_fetch_and_merge: false

  - name: dok-release-tag-create
    target: tag
    enforcement: active
    bypass_actors:
      - actor_id: '${team_id}'
        actor_type: Team
        bypass_mode: always
    rules:
      - name: Restrict creations
        type: creation

  - name: dok-release-tag-immutable
    target: tag
    enforcement: active
    bypass_actors: []
    rules:
      - name: Restrict updates
        type: update
        parameters:
          update_allows_fetch_and_merge: false
      - name: Restrict deletions
        type: deletion

actions_policies:
  - name: dok-prod-execution
    enforcement: active
    conditions:
      workflow_path:
        include: '${prod_workflows}'
        exclude: []
    rules:
      - name: Restrict actors
        type: restrict_actions_actors
        parameters:
          allowed_actors:
            - id: '${team_id}'
              type: Team
      - name: Restrict events
        type: restrict_action_events
        parameters:
          allowed_events: [release]

workflow_permissions:
  default_workflow_permissions: read
  can_approve_pull_request_reviews: false
