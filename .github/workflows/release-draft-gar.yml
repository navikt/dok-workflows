name: Release draft

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  create-release-draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0 # 7.9.0
        with:
          tag: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
