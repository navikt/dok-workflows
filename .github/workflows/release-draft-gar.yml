name: Release draft

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  create-release-draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@4d75298e00d9e34c483e5ff8c68d0ea1c1940c1e # 7.5.1
        with:
          tag: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
