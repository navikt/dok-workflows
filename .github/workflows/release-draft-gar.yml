name: Release draft

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  create-release-draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: release-drafter/release-drafter@c345907820e0396f6f44bcfd9ac4763325f8feb0 # 7.8.0
        with:
          tag: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
