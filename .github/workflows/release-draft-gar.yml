name: Release draft

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  create-release-draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # 7.11.0
        with:
          tag: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
