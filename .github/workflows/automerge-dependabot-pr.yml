name: Automerge Dependabot PRs, build and deploy to dev, and create release draft

on:
  workflow_call:
    secrets:
      AUTOMERGE_APP_PRIVATE_KEY:
        description: Privatnøkkel fra miljøet dependabot-automerge ved bruk av app-token
        required: false
    inputs:
      use-app-token:
        description: Bruk GitHub App til merge
        type: boolean
        required: false
        default: false
      ignored-dependencies:
        description: Komma-separert liste over dependencies som ikke skal automerges
        type: string
        required: false
        default: ''
      semver-filter:
        description: Semver filter for hvilke versjoner som kan automerges
        type: string
        required: false
        default: 'patch,minor,unknown'
      always-allow:
        description: Komma-separert liste over dependencies som alltid skal automerges, uavhengig av semver-filter
        type: string
        required: false
        default: ''
      minimum-age-of-pr:
        description: Minimum alder på PR i dager før den automerges
        type: string
        required: false
        default: '0'
      java-version:
        description: Java version som skal brukes til bygging. Utledes om ikke angitt
        type: string
        required: false
        default: ''
      deploy-and-draft-release:
        description: Deploy til dev og lag release draft. Relevant for nais-job apper som ikke skal deployes eller releases
        type: boolean
        required: false
        default: true
      build-artifact:
        description: Bygg artifact. Relevant for apper som publiserer java moduler, feks dok-common
        type: boolean
        required: false
        default: false
      nav-cluster:
        description: Cluster bygget deployes til. dev-fss er standard
        type: string
        required: false
        default: 'dev-fss'

jobs:
  automerge:
    if: ${{ !inputs.use-app-token }}
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    outputs:
      merged-pr-count: ${{ steps.automerge.outputs.merged-pr-count }}
    steps:
      - name: Automerge Dependabot PRs
        id: automerge
        uses: navikt/automerge-dependabot@main
        with:
          token: ${{ github.token }}
          minimum-age-of-pr: ${{ inputs.minimum-age-of-pr }}
          blackout-periods: 'Sat,Sun,May 1,May 17,Dec 24-Jan 3'
          ignored-dependencies: ${{ inputs.ignored-dependencies }}
          semver-filter: ${{ inputs.semver-filter }}
          always-allow: ${{ inputs.always-allow }}
      - name: Automerge results
        run: |
          echo "Automerge Resultat:"
          echo "Antall mergede PRer: ${{ steps.automerge.outputs.merged-pr-count }}"
          echo "Fortsetter med build/deploy: ${{ steps.automerge.outputs.merged-pr-count != '0' }}"

  automerge-app:
    if: inputs.use-app-token && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    environment: dependabot-automerge
    permissions: {}
    concurrency:
      group: dependabot-automerge-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: read
          permission-checks: read
          permission-statuses: read
      - name: Automerge Dependabot PRs
        id: automerge
        uses: navikt/automerge-dependabot@main
        with:
          token: ${{ steps.app-token.outputs.token }}
          minimum-age-of-pr: ${{ inputs.minimum-age-of-pr }}
          blackout-periods: 'Sat,Sun,May 1,May 17,Dec 24-Jan 3'
          ignored-dependencies: ${{ inputs.ignored-dependencies }}
          semver-filter: ${{ inputs.semver-filter }}
          always-allow: ${{ inputs.always-allow }}
          auto-approve: 'false'
          update-branch-before-merge: 'false'
      - name: Automerge results
        env:
          MERGED_PR_COUNT: ${{ steps.automerge.outputs.merged-pr-count }}
        run: |
          echo "Antall mergede PRer: $MERGED_PR_COUNT"
          echo "Bygg, deploy og release draft håndteres av repoets push-workflow."

  build-artifact:
    needs: automerge
    if: ${{ !inputs.use-app-token && needs.automerge.outputs.merged-pr-count != '0' && inputs.build-artifact }}
    uses: navikt/dok-workflows/.github/workflows/build-artifact.yml@main
    secrets: inherit
    with:
      java-version: ${{ inputs.java-version }}

  #Bygg, deploy til dev, og lag release draft. Disse stegne gjør det samme som build-deploy-main-gar.yml,
  #men GHA har en "kall dybde" grense på max 3, så buid-deploy-main-gar.yml kan ikke kalles direkte herfra.
  #Se https://github.com/orgs/community/discussions/8488
  build-main:
    needs: automerge
    if: ${{ !inputs.use-app-token && needs.automerge.outputs.merged-pr-count != '0' && !inputs.build-artifact }}
    uses: navikt/dok-workflows/.github/workflows/build-app-gar.yml@main
    secrets: inherit
    with:
      java-version: ${{ inputs.java-version }}

  deploy-main:
    needs: [build-main, automerge]
    if: ${{ !inputs.use-app-token && needs.automerge.outputs.merged-pr-count != '0' && inputs.deploy-and-draft-release && !inputs.build-artifact }}
    uses: navikt/dok-workflows/.github/workflows/deploy-all-dev-gar.yml@main
    secrets: inherit
    with:
      image: ${{ needs.build-main.outputs.image }}
      nav-cluster: ${{ inputs.nav-cluster }}

  draft-release:
    needs: [build-main, automerge]
    if: ${{ !inputs.use-app-token && needs.automerge.outputs.merged-pr-count != '0' && inputs.deploy-and-draft-release && !inputs.build-artifact }}
    uses: navikt/dok-workflows/.github/workflows/release-draft-gar.yml@main
    with:
      tag: ${{ needs.build-main.outputs.tag }}
