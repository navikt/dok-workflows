name: Refresh base images

on:
  schedule:
    - cron: '0 7 * * 1-5'
      timezone: Europe/Oslo
  workflow_dispatch:
    inputs:
      repository:
        description: Repository name, or leave empty to rebuild all apps in baseimage/apps.json
        required: false
        type: string

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    environment: build-release
    steps:
      - uses: actions/checkout@v7
        if: inputs.repository == ''

      - name: Select repositories
        id: repositories
        env:
          REQUESTED_REPOSITORY: ${{ inputs.repository }}
        run: |
          if [[ -n "$REQUESTED_REPOSITORY" ]]; then
            repositories=$(jq -cn --arg repository "$REQUESTED_REPOSITORY" '[$repository]')
          else
            repositories=$(jq -c '.apps' baseimage/apps.json)
          fi
          if ! jq -e 'length > 0' <<< "$repositories" > /dev/null; then
            echo "::error::No repositories selected"
            exit 1
          fi
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"

      - name: Create dispatch token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DOK_BUILD_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOK_BUILD_RELEASE_APP_PRIVATE_KEY }}
          owner: navikt
          repositories: ${{ join(fromJSON(steps.repositories.outputs.repositories), ',') }}
          permission-actions: write

      - name: Dispatch app workflows
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORIES: ${{ steps.repositories.outputs.repositories }}
        run: |
          jq -r '.[]' <<< "$REPOSITORIES" > repositories.txt
          printf '## Dispatched builds\n\nBuild and release results are reported in the app repositories.\n\n| Repository | Workflow run |\n| --- | --- |\n' \
            >> "$GITHUB_STEP_SUMMARY"
          failed=0
          while IFS= read -r repository; do
            repo="navikt/$repository"
            if default_branch=$(gh api "repos/$repo" --jq '.default_branch') &&
              run_url=$(gh api --method POST \
                "repos/$repo/actions/workflows/rebuild-and-release.yml/dispatches" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                -f "ref=$default_branch" --jq '.html_url'); then
              printf '| %s | [Open run](%s) |\n' "$repo" "$run_url" >> "$GITHUB_STEP_SUMMARY"
            else
              printf '| %s | Dispatch failed |\n' "$repo" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Failed to dispatch build and release for $repo"
              failed=1
            fi
          done < repositories.txt
          exit "$failed"
