name: Refresh base images

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Registered app repository to rebuild and release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: baseimage-refresh-orchestrator
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    environment: build-release
    timeout-minutes: 35
    env:
      REPOSITORY: ${{ inputs.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Select registered app
        id: app
        run: |
          if ! jq -e --arg repository "$REPOSITORY" \
            'any(.apps[]; .repository == $repository)' baseimage/apps.json > /dev/null; then
            echo "::error::Repository $REPOSITORY is not registered in baseimage/apps.json"
            exit 1
          fi
          echo "owner=${REPOSITORY%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Create dispatch token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DOK_BUILD_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOK_BUILD_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ steps.app.outputs.owner }}
          repositories: ${{ steps.app.outputs.name }}
          permission-actions: write

      - name: Dispatch app workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          run_id=$(gh api --method POST \
            "repos/$REPOSITORY/actions/workflows/rebuild-and-release.yml/dispatches" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -f "ref=$default_branch" \
            --jq '.workflow_run_id')

          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          printf '## Build and release\n\nRepository: `%s`\n\nRun: %s/%s/actions/runs/%s\n' \
            "$REPOSITORY" "$GITHUB_SERVER_URL" "$REPOSITORY" "$run_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for build and release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run-id }}
        run: |
          for attempt in {1..120}; do
            conclusion=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" \
              --jq 'if .status == "completed" then .conclusion else "pending" end')
            if [[ "$conclusion" != "pending" ]]; then
              printf '\nBuild and release result: `%s`\n' "$conclusion" >> "$GITHUB_STEP_SUMMARY"
              if [[ "$conclusion" != "success" ]]; then
                echo "::error::Build and release for $REPOSITORY concluded with $conclusion"
                exit 1
              fi
              exit 0
            fi
            sleep 15
          done
          echo "Build and release timed out after 30 minutes." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Timed out waiting for build and release in $REPOSITORY"
          exit 1
