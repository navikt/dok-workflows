on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      nav-cluster:
        required: true
        type: string
      nav-environment:
        required: true
        type: string
      checkout-ref:
        required: false
        type: string
        default: ''

jobs:
  deploy-nais-app-gar:
    name: Deploy to ${{ inputs.nav-environment }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}
      # sanity check
      - name: Check if nais/${{ inputs.nav-environment }}-config.json exists
        id: check-json
        run: echo "file-exists=$(test -f nais/${{ inputs.nav-environment }}-config.json && echo 'config_exists' || echo 'config_not_exists')" >> $GITHUB_OUTPUT
      - uses: nais/deploy/actions/deploy@v3
        if: ${{ steps.check-json.outputs.file-exists == 'config_exists' }}
        env:
          CLUSTER: ${{ inputs.nav-cluster }}
          RESOURCE: nais/naiserator.yaml
          VARS: nais/${{ inputs.nav-environment }}-config.json
          VAR: image=${{ inputs.image }}
      - name: No config files detected - unable to deploy
        if: ${{ steps.check-json.outputs.file-exists != 'config_exists' }}
        run: echo "::warning title=Unable to deploy::Could not find nais/${{ inputs.nav-environment }}-config.json"
      - name: Deploy summary
        if: ${{ steps.check-json.outputs.file-exists == 'config_exists' }}
        env:
          IMAGE: ${{ inputs.image }}
          NAV_CLUSTER: ${{ inputs.nav-cluster }}
          NAV_ENVIRONMENT: ${{ inputs.nav-environment }}
        run: |
          printf '## Deployed image\n\nImage: `%s`\n\nCluster: `%s`\n\nEnvironment: `%s`\n\nSource: `%s`\n' \
            "$IMAGE" "$NAV_CLUSTER" "$NAV_ENVIRONMENT" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"