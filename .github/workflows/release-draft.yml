name: Release draft

on:
  workflow_call:
    inputs:
      build-tag:
        required: true
        type: string

jobs:
  create-release-draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@eada3c96a64734dd381cfbda23511034e328ddb0 # 7.6.0
        with:
          tag: ${{ inputs.build-tag }}
          name: ${{ inputs.build-tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

