name: Release draft

on:
  workflow_call:
    inputs:
      build-tag:
        required: true
        type: string

jobs:
  create-release-draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # 7.7.0
        with:
          tag: ${{ inputs.build-tag }}
          name: ${{ inputs.build-tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

